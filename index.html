<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glintshot</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="container">
      <h1>Glintshot</h1>
      <p class="subtitle">Spike build: region capture and recording</p>

      <div id="idle-controls" class="row">
        <button id="capture-btn" type="button">Screenshot region</button>
        <button id="record-btn" type="button">Record region</button>
      </div>
      <p id="hint" class="hint">Drag to select; releasing the mouse saves or starts recording. Esc cancels.</p>

      <section id="recording" hidden>
        <p class="rec-status"><span class="rec-dot"></span> Recording <span id="rec-time">0:00</span></p>
        <p id="rec-detail" class="hint"></p>
        <button id="stop-btn" type="button">Stop and save</button>
        <p class="hint">Move this window off the recorded area, or it will appear in the video.</p>
      </section>

      <section id="result" hidden>
        <h2 id="r-title">Last capture</h2>
        <dl id="r-list"></dl>
      </section>
      <p id="error" class="error" hidden></p>
    </main>
  </body>
</html>
